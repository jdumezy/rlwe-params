[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rlwe-params"
version = "0.1.0"
description = "Certified RLWE parameter selection and tables, using lattice estimators as backends."
requires-python = ">=3.9"

[project.scripts]
rlwe-params = "rlwe_params.cli:main"

[tool.setuptools.packages.find]
include = ["rlwe_params*"]
