[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rlwe-params"
version = "0.1.0"
description = "RLWE parameter selection and tables, using lattice estimators as backends."
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Jules Dumezy"}]

[project.urls]
Repository = "https://github.com/jdumezy/rlwe-params"

[project.scripts]
rlwe-params = "rlwe_params.cli:main"

[tool.setuptools.packages.find]
include = ["rlwe_params*"]
